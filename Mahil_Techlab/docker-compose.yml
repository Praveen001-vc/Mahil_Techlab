services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: mahil_techlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      SECRET_KEY: django-insecure-change-this-in-production
      DEBUG: "False"
      ALLOWED_HOSTS: 127.0.0.1,localhost
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:8000,http://localhost:8000
      POSTGRES_DB: mahil_techlab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SITE_ID: "1"
      LOGIN_REDIRECT_URL: /
      LOGOUT_REDIRECT_URL: /
      SEED_COURSES: "1"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
