services:
  - type: web
    name: mahil-techlab-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "mahil-techlab-web.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mahil-techlab-web.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mahil-techlab-db
          property: connectionString
      - key: SITE_ID
        value: "1"
      - key: LOGIN_REDIRECT_URL
        value: "/"
      - key: LOGOUT_REDIRECT_URL
        value: "/"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SEED_COURSES
        value: "1"

databases:
  - name: mahil-techlab-db
    plan: free
    databaseName: mahil_techlab
    user: mahil_techlab
