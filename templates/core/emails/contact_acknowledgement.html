<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f3efe8;font-family:'Segoe UI',Tahoma,sans-serif;color:#1f2733;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3efe8;padding:20px 10px;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#fffdf8;border:1px solid #e8dece;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:20px 24px;background:linear-gradient(130deg,#0f6d8c,#2c8fac);color:#ffffff;">
                <p style="margin:0 0 8px 0;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;opacity:0.9;">Mahil Techlab</p>
                <h1 style="margin:0;font-size:22px;line-height:1.2;">Thank You for Contacting Us</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 24px 12px 24px;">
                <p style="margin:0 0 10px 0;font-size:14px;color:#203040;">Hello {{ contact_message.name }},</p>
                <p style="margin:0 0 8px 0;font-size:14px;color:#203040;line-height:1.6;">
                  Thank you for your message. Our team will review it and reach you soon.
                </p>
                <p style="margin:0;font-size:13px;color:#5f6978;">
                  Submitted email: <strong>{{ contact_message.email }}</strong>
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px 20px 24px;">
                <p style="margin:0;font-size:12px;color:#748091;">
                  This is an automated acknowledgement from {{ site_host }}.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
